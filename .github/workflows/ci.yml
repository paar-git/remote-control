name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web toolchain (format, lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version sync
        run: pnpm version:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      # The release generators otherwise only run when a tag is pushed, so a
      # defect in them surfaces as a failed release instead of a failed check.
      - name: Release pipeline smoke test
        run: pnpm release:smoke

  rust:
    # Conditional compilation means a symbol can be live on one platform and
    # dead on another, so lints and tests run on every platform the app ships
    # to rather than on Linux alone.
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The hosted Ubuntu image ships ~25 GB of toolchains this project never uses,
      # and the workspace outgrew what was left once screen capture pulled in
      # pipewire, drm and wayland: builds began failing with "No space left on
      # device" partway through, which reads as a compiler error rather than as a
      # full disk. Reclaiming the unused images is cheaper than trimming real work.
      - name: Reclaim disk space
        if: runner.os == 'Linux'
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/share/boost /usr/local/lib/node_modules             /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          echo "After:"; df -h / | tail -1

      # The desktop client links against the system webkit stack, so the Tauri
      # packaging dependencies are required even for a check-only build.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libwayland-dev \
            libdrm-dev \
            xvfb

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude rc-host-agent

      # rc-input's `inject` feature is off by default, but the step above happens to
      # enable it anyway: rc-host-agent turns it on by default and workspace feature
      # unification carries that to rc-input. That is incidental — one
      # `default-features = false` elsewhere would silently stop the injection backend's
      # tests from running, and they are the only check that the intent tables and the
      # platform keymap agree about what can be injected. Asking for the feature by
      # name makes the guarantee explicit instead of a side effect. The check is
      # per-platform by design: each runner asserts only that its own table is
      # injectable by its own backend, so all three runners together cover all three.
      - name: Input injection backend tests
        run: cargo test -p rc-input --features inject

      # The point of the `inject` feature is that rc-input builds without a desktop,
      # a display server or any FFI dependency. Nothing verified that until now — the
      # feature is on in every other step, so the headless path was never exercised.
      # Building the package alone resolves its features in isolation, which is the
      # only way to compile it as a machine with no desktop would.
      - name: Input builds without an injection backend
        run: cargo check -p rc-input

      # The capture backend needs a display server, so only its compile is checked
      # here; the tests that touch a real screen are #[ignore]d and run by hand.
      - name: Video capture backend compiles
        run: cargo clippy -p rc-video --features capture --all-targets -- -D warnings

      # The agent's end-to-end tests each stand up a real QUIC listener and
      # client. Running them in parallel on a two-core runner starves the
      # network stack: a connection completes its handshake and is then lost
      # before the client opens its first stream, failing whichever test loses
      # the race. Serialising this one binary removes the contention without
      # relaxing anything the tests assert.
      # Under a virtual display on Linux, because the video tests capture a real
      # screen. A hosted runner has no display server, so `XcapSource::new()` fails
      # and the agent can only refuse — which is correct behaviour but cannot prove
      # a keyframe ever arrives. Xvfb gives those tests something real to capture
      # rather than having them skipped or weakened.
      - name: Agent end-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" cargo test -p rc-host-agent -- --test-threads=1

      - name: Agent end-to-end tests
        if: runner.os != 'Linux'
        run: cargo test -p rc-host-agent -- --test-threads=1
