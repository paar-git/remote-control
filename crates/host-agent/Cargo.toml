[package]
name = "rc-host-agent"
description = "Host agent service: runs on the controlled machine and serves authenticated sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "rc_host_agent"
path = "src/lib.rs"

[[bin]]
name = "rc-agent"
path = "src/main.rs"

[features]
# Real OS input injection and display enumeration. On by default for the agent,
# which is the process that actually drives the machine.
default = ["inject"]
inject = ["rc-input/inject", "rc-video/capture", "rc-clipboard/system"]

[dependencies]
async-trait = { workspace = true }
rc-protocol = { workspace = true }
rc-input = { workspace = true }
rc-clipboard = { workspace = true }
rc-platform = { workspace = true }
rc-security = { workspace = true }
rc-storage = { workspace = true }
rc-transport = { workspace = true }
rc-video = { workspace = true }
rc-monitoring = { workspace = true }
rc-file-transfer = { workspace = true }
sysinfo = { workspace = true }
uuid = { workspace = true }
quinn = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rc-transport = { workspace = true }
blake3 = { workspace = true }

[lints]
workspace = true
